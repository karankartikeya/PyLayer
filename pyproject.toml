[project]
name = "pylayer"
version = "0.1.0"
description = "Python verification layer for Claude Code, exposed as an MCP server"
readme = "README.md"
authors = [
    { name = "karan kartikeya", email = "karankartikey72@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "basedpyright>=1.40.1",
    "mcp>=2.2.0",
]

[project.scripts]
pylayer = "pylayer.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
